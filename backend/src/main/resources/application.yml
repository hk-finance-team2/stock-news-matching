spring:
  application:
    name: stocknews
  config:
    # 저장소 최상위 .env 에서 DB 접속 정보를 읽음 (파일이 없으면 건너뜀, 환경변수가 있으면 환경변수 우선)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  # SQL은 resources/mapper 아래 XML 파일에 작성
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # DB 컬럼 stock_code -> Java 필드 stockCode 자동 연결
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    # API 문서 화면 주소: http://localhost:8080/swagger-ui.html
    path: /swagger-ui.html
