spring:
  application:
    name: stocknews
  config:
    # 저장소 최상위 .env 에서 DB 접속 정보를 읽음 (파일이 없으면 건너뜀, 환경변수가 있으면 환경변수 우선)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 기본은 진짜 공사 지시서(db/migration)만. 예시 기사(db/sample)는 .env 의 FLYWAY_LOCATIONS 로 켬
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    # 예시 기사를 켰다가 끈 PC에서도 서버가 멈추지 않게 (기록엔 있는데 파일 위치가 빠진 반복 지시서는 무시)
    ignore-migration-patterns: "*:future,repeatable:missing"

mybatis:
  # SQL은 resources/mapper 아래 XML 파일에 작성
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # DB 컬럼 stock_code -> Java 필드 stockCode 자동 연결
    map-underscore-to-camel-case: true

app:
  cors:
    # 우리 API를 부를 수 있는 프론트 주소 (Vite 개발 서버)
    allowed-origins: http://localhost:5173
  jwt:
    # 토큰 서명 키 (.env 의 JWT_SECRET, 32자 이상)
    secret: ${JWT_SECRET}
    # 토큰 유효 시간(분)
    expiration-minutes: 60

springdoc:
  swagger-ui:
    # API 문서 화면 주소: http://localhost:8080/swagger-ui.html
    path: /swagger-ui.html
