spring:
  application:
    name: stocknews
  config:
    # 저장소 최상위 .env 에서 DB 접속 정보를 읽음 (파일이 없으면 건너뜀, 환경변수가 있으면 환경변수 우선)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 기본: 공사 지시서(db/migration) + AI 수집 결과(db/ai-data, 본문 없음, 백엔드1이 PR로 최신화)
    # 예시 기사(db/sample)는 .env 의 FLYWAY_LOCATIONS 로 켬 (그때는 db/ai-data 도 같이 적어야 함)
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/ai-data}
    # 예시 기사를 켰다가 끈 PC에서도 서버가 멈추지 않게 (기록엔 있는데 파일 위치가 빠진 반복 지시서는 무시)
    ignore-migration-patterns: "*:future,repeatable:missing"

# 응답 압축(gzip): 브라우저가 받을 수 있다고 하면 1KB 넘는 응답을 줄여 보냄 (11/13: 홈 JSON 약 160KB가 압축 없이 오가던 것)
# 실시간 시세(SSE, text/event-stream)는 목록에 넣지 않음 — 압축하면 이벤트가 모였다가 늦게 감
server:
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1KB

# 헬스체크: /actuator/health 만 웹에 공개 (env·beans 같은 내부 정보는 닫음 — 보안 설정이 나머지 주소를 로그인 없이 열어 두므로 꼭 health 만)
# 결과는 UP/DOWN 만 (DB 연결 상태까지 반영, 자세한 내용은 숨김). Docker healthcheck 가 30초마다 부름 (docker-compose.yml)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis:
  # SQL은 resources/mapper 아래 XML 파일에 작성
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # DB 컬럼 stock_code -> Java 필드 stockCode 자동 연결
    map-underscore-to-camel-case: true

app:
  cors:
    # 우리 API를 부를 수 있는 프론트 주소 (Vite 개발 서버)
    allowed-origins: http://localhost:5173
  jwt:
    # 토큰 서명 키 (.env 의 JWT_SECRET, 32자 이상)
    secret: ${JWT_SECRET}
    # 토큰 유효 시간(분)
    expiration-minutes: 60

springdoc:
  swagger-ui:
    # API 문서 화면 주소: http://localhost:8080/swagger-ui.html
    path: /swagger-ui.html
