# 프론트 컨테이너의 웹 서버 설정 (frontend/Dockerfile)
# - 화면 파일(dist)을 보여 줌
# - /api 로 시작하는 요청은 백엔드 컨테이너로 넘김 → 브라우저는 한 주소(localhost:5173)만 보면 되고 CORS 문제 없음
#   (개발 때 vite.config.js 프록시와 같은 역할)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 상자를 다시 만들면 내부 주소(IP)가 바뀜. 켤 때 한 번 찾은 주소를 계속 쓰면 502 → Docker DNS 에 10초마다 다시 물음
    # (proxy_pass 에 변수를 쓰면 요청할 때 이름을 찾음. 경로·물음표 뒤 값은 그대로 넘어감)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 실시간 방송(SSE)은 모아 두지 말고 바로바로 넘김, 오래 열려 있어도 끊지 않음
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # 화면 안 주소로 바로 들어와도(새로고침) index.html 을 줌 (React 한 페이지 앱)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
