# 백엔드 자동 테스트 (CI)
# PR을 열거나 PR에 push가 더 생기면, 그리고 main에 merge되면 GitHub가 빈 컴퓨터를 빌려
# MariaDB를 띄우고 backend의 ./gradlew test를 돌린다. 결과는 PR 화면에 ✅/❌로 보임
# PR에서는 "PR 코드 + 최신 main을 합친 모습"으로 돌린다 (GitHub가 자동으로)
# 백엔드와 이 파일이 안 바뀐 PR(ai/, frontend/, docs/만 바꾼 PR)은 돌리지 않음

name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# 코드를 읽기만 함 (레포에 쓰기 권한 없음)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 한국 시간 (백엔드 Docker 실행과 같음). "오늘 0시" 기준이 틀어지지 않게
      TZ: Asia/Seoul
      # CI 전용 테스트 값. 진짜 비밀번호가 아니고 이 일회용 컴퓨터 안에서만 씀 (.env는 올리지 않음)
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: stocknews
      DB_USERNAME: stocknews_ci
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghij

    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # services: 로는 MariaDB 시작 옵션(한국 시간·utf8mb4)을 못 넘겨서 docker run으로 직접 띄움
      # 버전·옵션은 docker-compose.yml의 db와 똑같이
      - name: MariaDB 켜기
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=ci-only-root-password \
            -e MARIADB_DATABASE="$DB_NAME" \
            -e MARIADB_USER="$DB_USERNAME" \
            -e MARIADB_PASSWORD="$DB_PASSWORD" \
            -e TZ=Asia/Seoul \
            mariadb:11.8.9 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --default-time-zone=+09:00

      - name: Java 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 내려받은 라이브러리를 다음 실행 때 다시 쓰게 저장 (빨라짐)
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v6

      - name: DB가 준비될 때까지 기다리기
        run: |
          for i in $(seq 1 30); do
            if docker exec db healthcheck.sh --connect --innodb_initialized; then
              exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1

      - name: 테스트
        working-directory: backend
        run: ./gradlew test

      # 실패하면 어느 테스트가 왜 실패했는지 보고서(HTML)를 내려받을 수 있게 올려 둠
      - name: 테스트 보고서 올리기 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test/
          retention-days: 7
