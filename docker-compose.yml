# 팀 공용 실행 환경. 값은 .env 에서 읽습니다. (.env.example 참고)
# DB + 백엔드 켜기: docker compose up -d --build   (Java 설치 필요 없음)
# DB만 켜기:        docker compose up -d db       (백엔드를 gradlew bootRun으로 개발할 때)
services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      # 내 PC 포트(DB_PORT) -> 컨테이너 안 3306
      - "${DB_PORT}:3306"
    volumes:
      # 컨테이너를 지워도 데이터는 남도록 별도 보관
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # .env의 DB 계정·JWT_SECRET 등을 그대로 사용
    env_file: .env
    environment:
      # 상자끼리는 서비스 이름(db)과 컨테이너 안 포트(3306)로 연결
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      # DB가 접속 가능해진 뒤에 백엔드 시작
      db:
        condition: service_healthy

volumes:
  db-data:
